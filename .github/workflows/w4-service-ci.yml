name: W4 service verification

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, feat/w4-service-handoff, feat/w4-question-core-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-2022
            python: "3.13"
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked API and test dependencies
        run: |
          mkdir -p output/ci
          uv --version > output/ci/uv-version.txt
          uv sync --locked --extra api --extra test 2>&1 | tee output/ci/install.log
      - name: Run full suite and two synthetic HTTP demos
        run: |
          uv run --locked --extra api --extra test python scripts/verify_service_handoff.py --output-dir output/ci/verification
      - name: Retain verification artifacts, including failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: w4-service-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/
          if-no-files-found: error
          retention-days: 14

  question-core-container:
    name: Question Core container / synthetic config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned container without publishing
        run: docker build --build-arg W4_SOURCE_SHA="$GITHUB_SHA" -f deploy/question-core/Dockerfile -t w4-ct12-ci .
      - name: Verify entrypoint and persistent store across two containers
        shell: bash
        run: |
          set -euo pipefail
          docker volume create w4-ct12-ci-outbox
          trap 'docker volume rm w4-ct12-ci-outbox' EXIT
          mkdir -p output/ci/container
          for attempt in 1 2; do
            docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
              -e W1_W4_CONTEXT_BEARER=SYNTHETIC-CI-NOT-A-SECRET \
              -v "$PWD/samples/question-core-w1-context-20260919:/run/w4-plan:ro" \
              -v w4-ct12-ci-outbox:/var/lib/w4 w4-ct12-ci check \
              | tee "output/ci/container/check-$attempt.json"
          done
          docker image inspect --format '{{.Id}}' w4-ct12-ci > output/ci/container/local-image-id.txt
      - name: Retain container smoke evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: w4-question-core-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/container/
          if-no-files-found: warn
          retention-days: 14
